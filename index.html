<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>TaTyshop</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://vk.ru/js/api/openapi.js?168"></script>
  <script>
    VK.init({ apiId: 54522333, onlyWidgets: true });
  </script>
</head>

<body class="bg-neutral-950 text-white">

<header class="flex justify-between p-4 border-b border-neutral-800">
  <h1 class="text-2xl font-bold">TaTyshop</h1>
  <a href="catalog.html" class="bg-blue-600 px-4 py-2 rounded-xl">Каталог</a>
</header>

<div class="flex max-w-7xl mx-auto">

  <!-- VK LEFT -->
  <aside class="w-72 p-4 hidden lg:block">
    <div class="sticky top-4">
      <div class="overflow-hidden rounded-2xl">
        <div id="vk_groups"></div>
      </div>
    </div>

    <script>
      VK.Widgets.Group("vk_groups", {
        mode: 4,
        width: "250",
        height: 400
      }, 237321487);
    </script>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 p-10">
    <h2 class="text-3xl font-bold mb-4">Добро пожаловать в TaTyshop</h2>
    <p class="text-neutral-400 mb-6">
      Лучшие переводные татуировки
    </p>

    <a href="catalog.html" class="bg-blue-600 px-6 py-3 rounded-xl">
      Перейти в каталог
    </a>
  </main>

</div>

</body>
</html>
